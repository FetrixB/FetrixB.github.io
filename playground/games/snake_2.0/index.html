<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snake 2.0</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #080813; color: #f3f2ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at top, #19142d, #080813 65%); }
    main { width: min(100%, 520px); text-align: center; }
    h1 { margin: 0 0 14px; letter-spacing: .12em; text-transform: uppercase; }
    canvas { display: block; width: min(100%, 440px); height: auto; margin: auto; border: 2px solid #6739a5; border-radius: 12px; box-shadow: 0 0 28px #5521b866; }
    .bar { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
    button, select { border: 1px solid #7651aa; border-radius: 7px; padding: 8px 12px; background: #171326; color: inherit; font: inherit; }
    .hint { color: #b9b2d2; font-size: .9rem; margin: 12px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>Snake 2.0</h1>
    <canvas id="game" width="440" height="440" aria-label="Snake game"></canvas>
    <div class="bar">
      <strong id="score">Score: 0</strong>
      <label for="speed">Speed</label>
      <select id="speed" aria-label="Game speed">
        <option value="150">Easy</option><option value="110" selected>Normal</option>
        <option value="75">Hard</option><option value="45">Insane</option>
      </select>
      <button id="restart" type="button">Restart</button>
    </div>
    <p class="hint">Arrow keys or WASD to move. Food is pulled into the head when it gets within 10 px.</p>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const size = 22;
      const cols = canvas.width / size;
      const rows = canvas.height / size;
      const scoreEl = document.getElementById('score');
      const speedSelect = document.getElementById('speed');
      let snake, food, dir, nextDir, score, running, timerId;
      let deathAt = 0;
      let deathPoint = { x: 0, y: 0 };
      const wrap = (n, max) => (n + max) % max;

      function placeFood() {
        let cell;
        do {
          cell = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
        } while (snake.some(part => part.x === cell.x && part.y === cell.y));
        // Offset within the cell lets the 10 px magnetic radius be visible and useful.
        food = { x: cell.x * size + size / 2 + (Math.random() * 12 - 6), y: cell.y * size + size / 2 + (Math.random() * 12 - 6) };
      }

      function reset() {
        snake = [{ x: Math.floor(cols / 2), y: Math.floor(rows / 2) }];
        dir = { x: 1, y: 0 };
        nextDir = { ...dir };
        score = 0;
        running = true;
        deathAt = 0;
        scoreEl.textContent = 'Score: 0';
        placeFood();
        restartLoop();
      }

      function restartLoop() {
        clearInterval(timerId);
        timerId = setInterval(step, Number(speedSelect.value));
      }

      function step() {
        if (!running) return;
        dir = nextDir;
        const head = { x: wrap(snake[0].x + dir.x, cols), y: wrap(snake[0].y + dir.y, rows) };
        if (snake.some(part => part.x === head.x && part.y === head.y)) {
          running = false;
          deathAt = performance.now();
          deathPoint = { x: snake[0].x * size + size / 2, y: snake[0].y * size + size / 2 };
          return;
        }
        snake.unshift(head);
        const hx = head.x * size + size / 2;
        const hy = head.y * size + size / 2;
        const distance = Math.hypot(food.x - hx, food.y - hy);
        if (distance <= 10) {
          score++;
          scoreEl.textContent = `Score: ${score}`;
          placeFood();
          if (score % 5 === 0) restartLoop();
        } else {
          snake.pop();
        }
      }

      function draw(time) {
        const phase = time / 1300;
        const hue = (250 + Math.sin(phase) * 24) % 360;
        ctx.fillStyle = '#05050a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Animated purple, blue and black floor tiles.
        for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
          const wave = (Math.sin(phase + x * .28 + y * .21) + 1) / 2;
          // The floor cycles through near-black, electric blue, and purple.
          const brightness = wave < .2 ? 2 : 9 + wave * 17;
          ctx.fillStyle = `hsl(${(hue + wave * 35) % 360}, 88%, ${brightness}%)`;
          ctx.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
        }
        // Pull the food smoothly toward the head inside a 10 px radius.
        if (running && snake.length) {
          const hx = snake[0].x * size + size / 2;
          const hy = snake[0].y * size + size / 2;
          const dx = hx - food.x, dy = hy - food.y;
          const distance = Math.hypot(dx, dy);
          if (distance > 0 && distance <= 10) {
            food.x += dx * .22;
            food.y += dy * .22;
          }
        }
        const pulse = 1 + Math.sin(time / 130) * .12;
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#ff4dda';
        ctx.fillStyle = '#ff4dda';
        ctx.beginPath();
        ctx.arc(food.x, food.y, 6 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        snake.forEach((part, i) => {
          const x = part.x * size + 2, y = part.y * size + 2;
          ctx.fillStyle = i === 0 ? '#58e7ff' : `hsl(${(165 + i * 5 + time / 35) % 360}, 82%, 58%)`;
          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = i === 0 ? 14 : 5;
          ctx.fillRect(x, y, size - 4, size - 4);
        });
        ctx.shadowBlur = 0;
        if (!running) {
          const elapsed = time - deathAt;
          // Chromatic kill burst expands from the collision point, then fades.
          const intensity = Math.max(0, 1 - elapsed / 850);
          const radius = 18 + elapsed * .48;
          ctx.save();
          ctx.globalCompositeOperation = 'screen';
          for (const [color, offset] of [['#ff1744', -5], ['#00e5ff', 0], ['#d500f9', 5]]) {
            ctx.strokeStyle = color;
            ctx.globalAlpha = intensity * .85;
            ctx.lineWidth = 3 + intensity * 4;
            ctx.shadowColor = color;
            ctx.shadowBlur = 22 * intensity;
            ctx.beginPath();
            ctx.arc(deathPoint.x + offset, deathPoint.y - offset, radius, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.globalAlpha = intensity * .13;
          ctx.fillStyle = '#ff00a8';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.restore();
          ctx.fillStyle = 'rgba(0,0,0,.72)';
          ctx.fillRect(0, canvas.height / 2 - 34, canvas.width, 68);
          ctx.textAlign = 'center';
          ctx.font = 'bold 21px system-ui, sans-serif';
          ctx.fillStyle = `rgb(255, ${Math.round(45 + 180 * intensity)}, ${Math.round(80 + 175 * intensity)})`;
          ctx.shadowColor = '#00eaff';
          ctx.shadowBlur = intensity * 24;
          ctx.fillText('GAME OVER — RESTART', canvas.width / 2, canvas.height / 2 + 7);
          ctx.shadowBlur = 0;
        }
        requestAnimationFrame(draw);
      }

      function setDirection(x, y) {
        if (x !== -dir.x || y !== -dir.y) nextDir = { x, y };
      }
      window.addEventListener('keydown', event => {
        const key = event.key.toLowerCase();
        const directions = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
        if (directions[key]) { event.preventDefault(); setDirection(...directions[key]); }
      });
      document.getElementById('restart').addEventListener('click', reset);
      speedSelect.addEventListener('change', restartLoop);
      reset();
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
